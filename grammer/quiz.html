<script>
const questions = [
  // ===== string 기초 =====
  {
    tag: "string 부분 복사",
    q: "<code>string s = \"Hello, World!\";</code> 의 앞 5글자(\"Hello\")로 새 string을 만드시오.",
    a: `string sub(s, 0, 5);        // "Hello"
// string sub = s.substr(0, 5);`,
    note: "string(원본, pos, len) 생성자."
  },
  {
    tag: "같은 문자 반복",
    q: "'*' 문자 10개로 이루어진 string을 만드시오.",
    a: `string s(10, '*');          // "**********"`,
    note: "string(개수, char) 생성자."
  },
  {
    tag: "replace",
    q: "<code>string s = \"Hello, World!\";</code> 의 7번 위치부터 5글자를 \"word\"로 바꾸시오.",
    a: `s.replace(7, 5, "word");`,
    note: "replace(pos, len, 새문자열). 바꿀 글자 수가 달라도 됨."
  },
  {
    tag: "substr",
    q: "<code>string s = \"hello world\";</code> 에서 \"world\"만 추출하시오.",
    a: `string mid = s.substr(6, 5);   // "world"
// string mid = s.substr(6);     // pos부터 끝까지`,
    note: "substr(pos, len). 원본은 변하지 않음."
  },
  {
    tag: "erase",
    q: "<code>string s = \"hello world\";</code> 에서 \" world\"(공백 포함 6글자)를 삭제하시오.",
    a: `s.erase(5, 6);              // "hello"`,
    note: "erase(pos, len)는 원본을 직접 수정."
  },
  {
    tag: "insert",
    q: "<code>string s = \"helloworld\";</code> 의 5번 위치에 공백 \" \"을 끼워넣으시오.",
    a: `s.insert(5, " ");           // "hello world"`,
    note: "insert(pos, 문자열)."
  },
  {
    tag: "find / npos",
    q: "<code>string s = \"banana\";</code> 에서 \"na\"가 처음 나오는 위치를 구하고, 없을 때의 반환값은?",
    a: `size_t pos = s.find("na");  // 2
// 없으면 string::npos 반환`,
    note: "bool로 쓰면 안 됨. pos != string::npos 로 비교."
  },
  {
    tag: "find 반환 타입",
    q: "<code>s.find('a')</code> 의 반환 타입은 무엇인가?",
    choices: ["int", "size_t (unsigned, string::size_type)", "long long", "bool"],
    answer: 1,
    a: `size_t pos = s.find('a');   // string::size_type == size_t (unsigned)`,
    note: `없으면 string::npos = (size_t)-1 = 18446744073709551615. int에 담으면 -1로 잘려서 p < hi 같은 비교나 p + 1 에서 조용히 터진다. size_t는 unsigned라 p >= 0 은 항상 참이라 무의미하다.`
  },
  {
    tag: "find 시작 위치 지정",
    q: "<code>string s = \"aXbXcXd\";</code> 에서 3번 위치 이후에 처음 나오는 'X'의 위치를 구하시오.",
    a: `size_t p = s.find('X', 3);   // 3
// find(무엇, pos): pos부터 끝까지 검색. 시작점 제한 O, 끝 제한 X`,
    note: "임의의 [lo, hi) 구간을 한 번에 지정하는 문자열 find는 없다. 시작점은 pos로, 끝은 반환값을 hi와 비교해서 만든다."
  },
  {
    tag: "find [lo,hi) 구간 제한",
    q: "<code>string s = \"aXbXcXd\";</code> 에서 <code>[4, 6)</code> 구간 안에 'X'가 있는지 확인하시오.",
    a: `size_t lo = 4, hi = 6;
size_t p = s.find('X', lo);
bool hit = (p != string::npos && p < hi);   // true (p==5)`,
    note: "npos 먼저 체크가 필수. npos는 항상 hi보다 커서 p < hi 만 쓰면 우연히 걸러지지만 p + 1 같은 연산이 오버플로한다. 반복자로 진짜 제한하려면 std::search(s.begin()+lo, s.begin()+hi, ...) 또는 s.substr(lo, hi-lo).find('X')."
  },
  {
    tag: "rfind",
    q: "<code>string s = \"hello world hello\";</code> 에서 마지막 \"hello\"의 시작 위치를 구하시오.",
    a: `s.rfind("hello");      // 12
// s.rfind("hello", 5); // 0  ← pos 이하 구간에서 뒤에서부터`,
    note: "rfind는 뒤에서 찾지만 반환은 항상 앞쪽 인덱스. pos는 rfind에서 '상한'이다."
  },
  {
    tag: "find_first_of vs find",
    q: "<code>string s = \"hello\";</code> 에서 <code>s.find_first_of(\"lo\")</code> 가 찾는 것은?",
    choices: ["부분 문자열 \"lo\"의 위치", "'l' 또는 'o' 중 처음 나오는 위치", "\"lo\"의 마지막 위치", "'lo'가 연속으로 나오는 횟수"],
    answer: 1,
    a: `s.find_first_of("lo");   // 2  ('l' 하나만 찾음)
// 문자열 "lo"를 찾으려면 그냥 s.find("lo")`,
    note: `_of 계열(find_first_of/find_last_of/find_first_not_of/find_last_not_of)은 이름과 달리 문자 하나하나의 "집합"을 찾는다. find_first_not_of는 map/파싱할 때 자주 쓴다.`
  },
  {
    tag: "모든 위치 순회",
    q: "<code>string s = \"a.b.c.d\";</code> 에서 '.'이 나오는 모든 위치를 출력하는 반복문을 쓰시오.",
    a: `size_t pos = 0;
while ((pos = s.find('.', pos)) != string::npos) {
    cout << pos << " ";   // 1 3 5
    pos++;                // ← 없으면 무한루프
}`,
    note: "찾은 위치 그대로 다시 find에 넘기면 같은 자리를 계속 찾으므로 pos++로 한 칸 전진시켜야 한다."
  },
  {
    tag: "find 종류 반환값",
    q: "<code>std::find(v.begin(), v.end(), 5)</code> (algorithm) 가 값을 못 찾았을 때 반환하는 것은?",
    choices: ["string::npos", "-1", "v.end() (iterator)", "nullptr"],
    answer: 2,
    a: `auto it = std::find(v.begin(), v.end(), 5);   // 없으면 v.end()
// if (it != v.end()) { ... }`,
    note: `함정: string::find는 size_t + npos, std::find는 iterator + end(). 두 개를 섞어 npos 대신 end()를 비교하는 실수가 잦다.`
  },
  {
    tag: "append vs push_back",
    q: "<code>string s;</code> 에 문자열 \"!\" 와 문자 '?'를 각각 이어붙이시오.",
    a: `s.append("!");   // string 붙이기
s.push_back('?'); // char 붙이기`,
    note: "append는 문자열, push_back은 char 하나. s += 는 둘 다 가능."
  },
  {
    tag: "at vs []",
    q: "<code>string s = \"cc\";</code> 에서 0번 글자를 범위 체크 포함해서 접근하시오.",
    a: `s.at(0);        // 범위 벗어나면 예외
// s[0];        // 체크 없음(더 빠름)`,
    note: "at은 out_of_range 예외, []는 미검사."
  },
  {
    tag: "string compare",
    q: "<code>string a = \"banana\", b = \"nana\";</code> a의 [2,6)구간과 b 전체를 비교하시오.",
    a: `a.compare(2, 4, b);`,
    note: "compare(pos, len, 대상). 반환 <0/0/>0."
  },

  // ===== char ↔ string ↔ 숫자 =====
  {
    tag: "char→string",
    q: "<code>char tmp = 'c';</code> tmp 값을 string으로 변환하시오.",
    a: `string s(1, tmp);
// string s; s += tmp;  /  s.push_back(tmp);`,
    note: "string(size_t, char) 생성자. to_string(tmp)는 아스키 숫자(99)라 ❌"
  },
  {
    tag: "string→char",
    q: "<code>string s = \"hello\";</code> 첫 글자를 char c에 담으시오.",
    a: `char c = s[0];        // s.at(0), s.front() 도 가능`,
    note: "인덱스 접근 s[i]가 곧 char."
  },
  {
    tag: "string→int",
    q: "<code>string s = \"123\";</code> 를 int로 변환하시오.",
    a: `int n = stoi(s);`,
    note: "long은 stol, double은 stod. 실패 시 예외."
  },
  {
    tag: "int→string",
    q: "정수 <code>int n = 123;</code> 를 string으로 변환하시오.",
    a: `string s = to_string(n);    // "123"`,
    note: ""
  },
  {
    tag: "숫자문자→int",
    q: "<code>char c = '7';</code> 이 나타내는 숫자 7을 int로 구하시오.",
    a: `int n = c - '0';            // 55 - 48 = 7`,
    note: "char 산술은 int로 승격 → signed. size()와 달리 unsigned 아님."
  },
  {
    tag: "문자열→숫자(누적)",
    q: "<code>string s = \"1234\";</code> 를 stoi 없이 반복문으로 int로 만드시오.",
    a: `int n = 0;
for (char c : s) n = n * 10 + (c - '0');`,
    note: "각 자리를 c-'0'로 뽑아 10씩 곱하며 누적."
  },
  {
    tag: "string+char",
    q: "<code>string s = \"abc\";</code> 뒤에 <code>char c = 'd';</code> 를 붙이시오.",
    a: `s += c;               // "abcd"
// s = s + c;  /  s.push_back(c);`,
    note: "한쪽이 string이면 OK. char+char는 산술이 되니 주의."
  },

  // ===== 대소문자 =====
  {
    tag: "대문자화(산술)",
    q: "<code>char c = 'a';</code> 를 대문자로 바꿔 char up에 담으시오. (산술)",

    note: "'a'-'A'=32. cout으로 바로 출력하면 int라 (char) 캐스팅 필요."
  },
  {
    tag: "tolower/toupper",
    q: "<code>char c = 'A';</code> 를 소문자로 바꾸시오. (함수)",
    a: `char low = tolower(c);   // #include <cctype>`,
    note: "반환은 int. char에 담거나 (char) 캐스팅. 알파벳 아니면 그대로."
  },
  {
    tag: "문자열 전체 소문자화",
    q: "<code>string s = \"Hello\";</code> 전체를 소문자로 바꾸시오.",
    a: `for (char& c : s) c = tolower(c);
// transform(s.begin(), s.end(), s.begin(), ::tolower);`,
    note: "참조(char&)로 순회해야 원본이 바뀜."
  },
  {
    tag: "알파벳 순서",
    q: "<code>char c = 'C';</code> 가 알파벳에서 몇 번째인지(A=0 기준) 구하시오.",
    a: `int idx = c - 'A';    // 2`,
    note: "소문자는 c - 'a'."
  },

  // ===== vector =====
  {
    tag: "vector 초기화",
    q: "<code>int N;</code> 이 주어졌을 때, 크기 N이고 모든 값이 0인 int vector를 선언하시오.",
    a: `vector<int> v(N);     // 또는 vector<int> v(N, 0);`,
    note: "vector<int> v(N, 3)이면 3으로 채움."
  },
  {
    tag: "vector 삽입/삭제",
    q: "<code>vector<int> v;</code> 맨 앞에 1을 삽입하시오.",
    a: `v.insert(v.begin(), 1);`,
    note: "특정 위치는 v.begin()+i. 삭제는 v.erase(v.begin())."
  },
  {
    tag: "vector 뒤 조작",
    q: "<code>vector<int> v;</code> 맨 뒤에 3을 넣고, 맨 뒤 원소를 제거하시오.",
    a: `v.push_back(3);
v.pop_back();`,
    note: "맨 뒤 조회는 v.back()."
  },
  {
    tag: "pop_back 반환값",
    q: "<code>v.pop_back()</code> 은 삭제한 원소를 반환하는가? 마지막 값을 쓰면서 지우려면?",
    choices: [
      "삭제한 값을 반환한다 — int x = v.pop_back();",
      "void라 반환하지 않는다 — int x = v.back(); v.pop_back();",
      "iterator를 반환한다",
      "bool(성공 여부)을 반환한다"
    ],
    answer: 1,
    a: `int last = v.back();   // 먼저 조회
v.pop_back();           // void, 아무것도 반환 안 함`,
    note: `pop_back()은 void. queue.pop()/stack.pop()/priority_queue.pop() 도 값을 안 돌려줘서 front/top 을 먼저 쓴다. 같은 규칙.`
  },
  {
    tag: "erase 인자 (iterator)",
    q: "<code>vector<int> v;</code> 에서 <code>v.erase(2)</code> 처럼 인덱스로 지울 수 있는가? 인덱스 2를 지우는 올바른 코드는?",
    a: `// v.erase(2);              // ❌ 컴파일 에러 (erase는 iterator를 받음)
v.erase(v.begin() + 2);     // ✅ 인덱스 2 삭제`,
    note: `vector::erase 는 위치를 "iterator"로 받는다. 인덱스로 지우려면 begin() + i 로 변환. (map/set의 erase만 키로도 지울 수 있음)`
  },
  {
    tag: "erase 범위",
    q: "<code>vector<int> v = {1,2,3,4,5};</code> 에서 인덱스 1,2 두 개를 한 번에 지우시오.",

    note: `범위는 [first, last) 라서 끝 위치(last)는 삭제에 포함되지 않는다. 마지막 원소 하나 삭제는 v.erase(v.end() - 1) 또는 pop_back().`
  },

    q: "<code>queue<int> q;</code> 를 그대로 복사한 새 큐 q2를 만드시오.",
    a: `queue<int> q2 = q;`,
    note: "표준 컨테이너는 대입으로 깊은 복사됨."
  },

  // ===== 나머지 연산 =====
  {
    tag: "나머지 연산자",
    q: "<code>a % b</code> 의 결과 부호는 무엇을 따르는가?",
    choices: [
      "항상 0 이상 (수학적 modulo)",
      "왼쪽 피연산자(피제수)의 부호",
      "오른쪽 피연산자(제수)의 부호",
      "구현에 따라 다름"
    ],
    answer: 1,
    a: `7 % 3  ==  1
-7 % 3  == -1   // 왼쪽이 음수 → 결과도 음수
7 % -3  ==  1
-7 % -3 == -1`,
    note: `C++에선 부호가 피제수(왼쪽)를 따른다. 파이썬의 % 와 다르다(파이썬은 -7 % 3 == 2).`
  },
  {
    tag: "나머지 -7%3 값",
    q: "C++에서 <code>-7 % 3</code> 의 값은?",
    choices: ["2", "-1", "1", "-2"],
    answer: 1,
    a: `-7 % 3   // -1  (왼쪽 피연산자의 부호를 따름)`,
    note: `수학적 modulo(2)가 아니다. 부호를 떼고 싶으면 std::abs(-7 % 3), 항상 양수로 만들려면 ((x % m) + m) % m.`
  },
  {
    tag: "음수도 양수 나머지로",
    q: "음수를 넣어도 결과가 항상 0 이상(양수 나머지)이 나오게 하는 식을 쓰시오.",
    a: `int mod(int x, int m) { return ((x % m) + m) % m; }
// mod(-7, 3) == 2`,
    note: `코테에서 자주 쓰는 패턴. (x % m + m) 에서 m을 더해 음수를 양수로 올린 뒤 다시 % m 으로 범위를 맞춘다.`
  },
  {
    tag: "실수 나머지 fmod",
    q: "<code>double a = 7.5, b = 2.0;</code> 일 때 <code>a % b</code> 는 왜 안 되고, 대신 무엇을 쓰는가?",
    a: `double r = fmod(a, b);   // 1.5
// a % b;  // ❌ 컴파일 에러 (% 는 정수 전용)`,
    note: `% 연산자는 정수형만. 실수는 std::fmod (또는 std::remainder, 반올림 방식이 다름).`
  },
  {
    tag: "div (몫+나머지)",
    q: "7을 3으로 나눈 몫과 나머지를 <code>div</code>로 한 번에 구하시오.",
    a: `div_t d = div(7, 3);
cout << d.quot << " " << d.rem;   // 2 1
// C++11: auto [q, r] = std::div(7, 3);`,
    note: `자료형에 따라 div_t / ldiv_t / lldiv_t. /와 %를 두 번 하는 대신 나눗셈 한 번에 몫·나머지를 모두 얻는다.`
  },
  {
    tag: "홀수 판정 음수 함정",
    q: "<code>if (n % 2 == 1)</code> 로 홀수를 판정할 때 n이 음수면 왜 틀리는가?",
    a: `// n = -3 이면 -3 % 2 == -1 이므로 == 1 은 false
if (n % 2 != 0) { ... }   // ✅ 음수까지 올바른 홀수 판정`,
    note: `% 결과가 피제수 부호를 따르기 때문에 음수 홀수는 -1이 나온다. 홀수는 n % 2 != 0 으로 판정.`
  },
  {
    tag: "나머지 0으로 나누기",
    q: "<code>x % 0</code> 이나 <code>x / 0</code> 을 실행하면 어떻게 되는가?",
    choices: ["0을 반환", "npos 반환", "정의되지 않은 동작 (크래시)", "예외 out_of_range 발생"],
    answer: 2,
    a: `if (b != 0) { int r = a % b; }   // 나누기 전 0 체크`,
    note: `정수 0 나누기는 UB(undefined behavior)라 크래시. 실수 0.0 으로 나누면 inf/nan 이 나오는 것과 다르다.`
  },
  {
    tag: "곱셈 오버플로",
    q: "<code>100000 * 100000 % 7</code> 이 <code>1</code> 이 아니라 <code>3</code> 이 나오는 이유와 수정법은?",
    a: `// 곱셈이 int 범위를 넘어 오버플로 → 잘못된 값(3)
long long r = 100000LL * 100000 % 7;   // 1`,
    note: `큰 수 모듈러 연산은 중간값도 long long 으로. 필요하면 (a * b) 에서 각 항을 미리 % 로 줄인다.`
  }
];

const STORAGE_KEY = 'cpp-quiz-known';
let known = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

const quiz = document.getElementById('quiz');
questions.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card' + (known[i] ? ' known' : '');
  card.id = 'card-' + i;
  card.innerHTML = `
    <label class="know"><input type="checkbox" ${known[i] ? 'checked' : ''} onchange="setKnown(${i}, this.checked)"> 학습완료</label>
    <span class="qnum">Q${i + 1}</span><span class="qtag">${item.tag}</span>
    <div class="question">${item.q}</div>
    ${item.choices
      ? `<div class="choices">${item.choices.map((c, j) =>
          `<label class="choice" data-choice="${j}">
             <input type="radio" name="q${i}" value="${j}"> <span>${c}</span>
           </label>`).join('')}</div>
         <button class="btn-check" onclick="toggle(${i})">채점하기</button>
         <button class="btn-reset" onclick="resetQuestion(${i})">다시 풀기</button>
         <div class="verdict" id="verdict-${i}"></div>`
      : `<textarea placeholder="여기에 답을 적어보세요..."></textarea>
         <button class="btn-check" onclick="toggle(${i})">정답 확인하기</button>
         <button class="btn-reset" onclick="resetQuestion(${i})">다시 풀기</button>`}
    <div class="answer" id="ans-${i}">
      <div class="label">정답</div>
      <pre>${item.a.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
      ${item.note ? `<div class="note">💡 ${item.note.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>` : ''}
    </div>
  `;
  quiz.appendChild(card);
});
updateScore();

function setKnown(i, checked) {
  known[i] = checked;
  if (!checked) delete known[i];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(known));
  document.getElementById('card-' + i).classList.toggle('known', checked);
  updateScore();
}
function updateScore() {
  const n = Object.keys(known).length;
  document.querySelector('.score').textContent =
    `학습완료 ${n} / ${questions.length}` + (n === questions.length ? ' 🎉 완주!' : '');
}
function toggle(i) {
  const item = questions[i];
  const ansEl = document.getElementById('ans-' + i);

  // 객관식: 채점 후 정답 표시
  if (item.choices) {
    const picked = document.querySelector(`input[name="q${i}"]:checked`);
    const verdict = document.getElementById('verdict-' + i);

    if (!picked) {
      verdict.className = 'verdict bad';
      verdict.textContent = '먼저 선택지를 고르세요.';
      return;
    }
    const chosen = Number(picked.value);

    // 이 카드의 선택지들만 색칠
    const card = document.getElementById('card-' + i);
    card.querySelectorAll('.choice').forEach(el => {
      const j = Number(el.dataset.choice);
      el.classList.remove('correct', 'wrong');
      el.querySelector('.mark')?.remove();
      const mark = document.createElement('span');
      mark.className = 'mark';
      if (j === item.answer) { el.classList.add('correct'); mark.textContent = '✔ 정답'; }
      else if (j === chosen) { el.classList.add('wrong'); mark.textContent = '✘'; }
      if (j === item.answer || j === chosen) el.appendChild(mark);
    });

    const ok = chosen === item.answer;
    verdict.className = 'verdict ' + (ok ? 'ok' : 'bad');
    verdict.textContent = ok ? '정답입니다! 🎉' : '틀렸습니다.';
    ansEl.classList.add('show');
    return;
  }

  // 주관식: 기존 동작
  ansEl.classList.toggle('show');
}
function revealAll() {
  document.querySelectorAll('.answer').forEach(a => a.classList.add('show'));
}
function hideAll() {
  document.querySelectorAll('.answer').forEach(a => a.classList.remove('show'));
}
function resetQuestion(i) {
  const card = document.getElementById('card-' + i);

  const textarea = card.querySelector('textarea');
  if (textarea) textarea.value = '';

  card.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
  card.querySelectorAll('.choice').forEach(choice => {
    choice.classList.remove('correct', 'wrong');
    choice.querySelector('.mark')?.remove();
  });

  const verdict = document.getElementById('verdict-' + i);
  if (verdict) {
    verdict.className = 'verdict';
    verdict.textContent = '';
  }

  document.getElementById('ans-' + i).classList.remove('show');
}
function resetKnown() {
  if (!confirm('체크한 진행 상황을 모두 초기화할까요?')) return;
  known = {};
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('.card').forEach(c => c.classList.remove('known'));
  document.querySelectorAll('.know input').forEach(cb => cb.checked = false);
  updateScore();
}
</script>
