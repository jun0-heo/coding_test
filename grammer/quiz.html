<script>
const questions = [
  // ===== string 기초 =====
  {
    tag: "string 부분 복사",
    q: "<code>string s = \"Hello, World!\";</code> 의 앞 5글자(\"Hello\")로 새 string을 만드시오.",
    a: `string sub(s, 0, 5);        // "Hello"
// string sub = s.substr(0, 5);`,
    note: "string(원본, pos, len) 생성자."
  },
  {
    tag: "같은 문자 반복",
    q: "'*' 문자 10개로 이루어진 string을 만드시오.",
    a: `string s(10, '*');          // "**********"`,
    note: "string(개수, char) 생성자."
  },
  {
    tag: "replace",
    q: "<code>string s = \"Hello, World!\";</code> 의 7번 위치부터 5글자를 \"word\"로 바꾸시오.",
    a: `s.replace(7, 5, "word");`,
    note: "replace(pos, len, 새문자열). 바꿀 글자 수가 달라도 됨."
  },
  {
    tag: "substr",
    q: "<code>string s = \"hello world\";</code> 에서 \"world\"만 추출하시오.",
    a: `string mid = s.substr(6, 5);   // "world"
// string mid = s.substr(6);     // pos부터 끝까지`,
    note: "substr(pos, len). 원본은 변하지 않음."
  },
  {
    tag: "erase",
    q: "<code>string s = \"hello world\";</code> 에서 \" world\"(공백 포함 6글자)를 삭제하시오.",
    a: `s.erase(5, 6);              // "hello"`,
    note: "erase(pos, len)는 원본을 직접 수정."
  },
  {
    tag: "insert",
    q: "<code>string s = \"helloworld\";</code> 의 5번 위치에 공백 \" \"을 끼워넣으시오.",
    a: `s.insert(5, " ");           // "hello world"`,
    note: "insert(pos, 문자열)."
  },
  {
    tag: "find / npos",
    q: "<code>string s = \"banana\";</code> 에서 \"na\"가 처음 나오는 위치를 구하고, 없을 때의 반환값은?",
    a: `size_t pos = s.find("na");  // 2
// 없으면 string::npos 반환`,
    note: "bool로 쓰면 안 됨. pos != string::npos 로 비교."
  },
  {
    tag: "append vs push_back",
    q: "<code>string s;</code> 에 문자열 \"!\" 와 문자 '?'를 각각 이어붙이시오.",
    a: `s.append("!");   // string 붙이기
s.push_back('?'); // char 붙이기`,

  },
  {
    tag: "at vs []",
    q: "<code>string s = \"cc\";</code> 에서 0번 글자를 범위 체크 포함해서 접근하시오.",
    a: `s.at(0);        // 범위 벗어나면 예외
// s[0];        // 체크 없음(더 빠름)`,

  },
  {
    tag: "string compare",

    a: `a.compare(2, 4, b);`,
    note: "compare(pos, len, 대상). 반환 <0/0/>0."

    tag: "char→string",

// string s; s += tmp;  /  s.push_back(tmp);`,

  {

    q: "<code>string s = \"hello\";</code> 첫 글자를 char c에 담으시오.",

    tag: "string→int",
    q: "<code>string s = \"123\";</code> 를 int로 변환하시오.",

  },
  {
    tag: "int→string",
    q: "정수 <code>int n = 123;</code> 를 string으로 변환하시오.",

    note: ""
  },
  {
    tag: "숫자문자→int",
    q: "<code>char c = '7';</code> 이 나타내는 숫자 7을 int로 구하시오.",

  },
  {
    tag: "문자열→숫자(누적)",

    note: "각 자리를 c-'0'로 뽑아 10씩 곱하며 누적."
  },
  {
    tag: "string+char",
    q: "<code>string s = \"abc\";</code> 뒤에 <code>char c = 'd';</code> 를 붙이시오.",
    a: `s += c;               // "abcd"
// s = s + c;  /  s.push_back(c);`,

  },

  {
    tag: "tolower/toupper",
    q: "<code>char c = 'A';</code> 를 소문자로 바꾸시오. (함수)",

  },
  {
    tag: "문자열 전체 소문자화",

    a: `for (char& c : s) c = tolower(c);
// transform(s.begin(), s.end(), s.begin(), ::tolower);`,

  },
  {
    tag: "알파벳 순서",
    q: "<code>char c = 'C';</code> 가 알파벳에서 몇 번째인지(A=0 기준) 구하시오.",
    a: `int idx = c - 'A';    // 2`,
    note: "소문자는 c - 'a'."
  },

  // ===== vector =====
  {
    tag: "vector 초기화",

  },
  {
    tag: "vector 삽입/삭제",

  },
  {
    tag: "vector 뒤 조작",

v.pop_back();`,

    tag: "resize",

  {
    tag: "assign",

    a: `v.assign(5, false);`,
    note: "다차원도 v.assign(rows, vector<bool>(cols, false)) 가능."
  },
  {
    tag: "2D vector",

  {

    q: "depth×rows×columns 크기의 3차원 int vector를 선언하시오.",
    a: `vector<vector<vector<int>>> v(

  },

    cout << *it << " ";`,

  },
  {

int idx = it - v.begin();`,

  // ===== STL 알고리즘 =====
  {

    a: `sort(v.begin(), v.end());`,

  },
  {
    tag: "sort 사용자정의",

  },

  },

    // 사용

  {
    tag: "tuple 구조분해",
    q: "<code>tuple<int,int,int> t = {1,2,3};</code> 를 a,b,c로 분해하시오.",
    a: `auto [a, b, c] = t;`,
    note: "개별 접근은 get<0>(t)."
  },

  // ===== pair =====
  {
    tag: "pair 구조분해",
    q: "<code>pair<int,int> p = {1,2};</code> 를 구조 분해로 a, b에 담으시오.",
    a: `auto [a, b] = p;      // a=1, b=2`,
    note: "p.first / p.second 로도 접근."
  },
  {
    tag: "pair 비교",
    q: "두 pair p1, p2를 비교해 p1이 사전순으로 더 작은지 확인하시오.",
    a: `if (p1 < p2) { ... }`,
    note: "first가 같으면 second로 비교. ==,<,> 등 지원."
  },
  {
    tag: "vector<pair>",
    q: "<code>vector<pair<int,int>> v;</code> 에 (7,8)을 추가하시오.",
    a: `v.push_back({7, 8});`,
    note: "make_pair(7,8)도 가능."
  },

  // ===== 기타 =====
  {
    tag: "call by reference",
    q: "함수 인자를 참조로 받아 원본을 바꾸려면 매개변수를 어떻게 선언하는가?",
    a: `void modify(int& value) { value = 20; }`,
    note: "&를 붙이면 원본이 바뀜. 복사 없음."
  },
  {
    tag: "컨테이너 복사",
    q: "<code>queue<int> q;</code> 를 그대로 복사한 새 큐 q2를 만드시오.",
    a: `queue<int> q2 = q;`,
    note: "표준 컨테이너는 대입으로 깊은 복사됨."
  }
];

const STORAGE_KEY = 'cpp-quiz-known';
let known = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

const quiz = document.getElementById('quiz');
questions.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card' + (known[i] ? ' known' : '');
  card.id = 'card-' + i;
  card.innerHTML = `
    <label class="know"><input type="checkbox" ${known[i] ? 'checked' : ''} onchange="setKnown(${i}, this.checked)"> 학습완료</label>
    <span class="qnum">Q${i + 1}</span><span class="qtag">${item.tag}</span>
    <div class="question">${item.q}</div>
    <textarea placeholder="여기에 답을 적어보세요..."></textarea>
    <button class="btn-check" onclick="toggle(${i})">정답 확인하기</button>
    <div class="answer" id="ans-${i}">
      <div class="label">정답</div>
      <pre>${item.a.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
      ${item.note ? `<div class="note">💡 ${item.note}</div>` : ''}
    </div>
  `;
  quiz.appendChild(card);
});
updateScore();

function setKnown(i, checked) {
  known[i] = checked;
  if (!checked) delete known[i];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(known));
  document.getElementById('card-' + i).classList.toggle('known', checked);
  updateScore();
}
function updateScore() {
  const n = Object.keys(known).length;
  document.querySelector('.score').textContent =
    `학습완료 ${n} / ${questions.length}` + (n === questions.length ? ' 🎉 완주!' : '');
}
function toggle(i) {
  document.getElementById('ans-' + i).classList.toggle('show');
}
function revealAll() {
  document.querySelectorAll('.answer').forEach(a => a.classList.add('show'));
}
function hideAll() {
  document.querySelectorAll('.answer').forEach(a => a.classList.remove('show'));
}
function resetKnown() {
  if (!confirm('체크한 진행 상황을 모두 초기화할까요?')) return;
  known = {};
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('.card').forEach(c => c.classList.remove('known'));
  document.querySelectorAll('.know input').forEach(cb => cb.checked = false);
  updateScore();
}
</script>
</body>
</html>
